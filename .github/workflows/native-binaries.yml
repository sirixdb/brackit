name: Build native binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os-name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: linux
            arch: amd64
            artifact: bjq-linux-amd64
          - runner: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
            artifact: bjq-linux-arm64
          - runner: macos-15-intel
            os-name: macos
            arch: amd64
            artifact: bjq-macos-amd64
          - runner: macos-latest
            os-name: macos
            arch: arm64
            artifact: bjq-macos-arm64
          - runner: windows-latest
            os-name: windows
            arch: amd64
            artifact: bjq-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PGO training data
        shell: bash
        run: |
          python3 -c "
          import json, random
          random.seed(42)
          cities = ['NYC','LA','Chicago','Houston','Phoenix','Dallas','Seattle','Denver','Boston','Miami']

          # Object-wrapped array (common bjq input pattern)
          users = [{'name': f'user_{i}', 'age': random.randint(18,65), 'city': random.choice(cities)} for i in range(100000)]
          orders = [{'id': i, 'user_id': random.randint(0,9999), 'amount': round(random.uniform(10,500),2)} for i in range(50000)]
          json.dump({'users': users, 'orders': orders}, open('pgo-obj.json','w'))

          # Top-level array (streaming/vectorized path)
          json.dump(users, open('pgo-arr.json','w'))
          "

      - name: Build PGO-instrumented binary
        run: mvn -Pnative-pgo-instrument package -DskipTests

      - name: Collect PGO profiles
        shell: bash
        run: |
          INSTRUMENTED=target/bjq-instrument
          if [ -f "${INSTRUMENTED}.exe" ]; then INSTRUMENTED="${INSTRUMENTED}.exe"; fi

          # Exercise all major code paths for thorough PGO coverage:

          # 1. Filter queries (ForBind + Select hot path)
          $INSTRUMENTED 'count(for $u in $$.users[] where $u.age > 30 return $u.name)' pgo-obj.json > /dev/null 2>&1 || true

          # 2. Group-by queries (GroupBy + Grouping hot path)
          $INSTRUMENTED 'for $u in $$.users[] let $c := $u.city group by $c return {"city": $c, "count": count($u)}' pgo-obj.json > /dev/null 2>&1 || true

          # 3. Join queries (TableJoin + hash join hot path)
          $INSTRUMENTED 'for $u in $$.users[], $o in $$.orders[] where $o.user_id eq $u.age return {"name": $u.name, "amount": $o.amount}' pgo-obj.json > /dev/null 2>&1 || true

          # 4. Order-by queries (TupleSort hot path)
          $INSTRUMENTED 'for $u in $$.users[] order by $u.age descending return $u.name' pgo-obj.json > /dev/null 2>&1 || true

          # 5. Aggregation functions
          $INSTRUMENTED 'sum(for $u in $$.users[] return $u.age)' pgo-obj.json > /dev/null 2>&1 || true

          # 6. Streaming path (top-level array)
          $INSTRUMENTED 'count(for $u in $$[] where $u.age > 30 return $u.name)' pgo-arr.json > /dev/null 2>&1 || true
          $INSTRUMENTED 'for $u in $$[] let $c := $u.city group by $c return {"city": $c, "count": count($u)}' pgo-arr.json > /dev/null 2>&1 || true

          # 7. Run twice for JIT-like profile depth
          $INSTRUMENTED 'count(for $u in $$.users[] where $u.age > 30 return $u.name)' pgo-obj.json > /dev/null 2>&1 || true
          $INSTRUMENTED 'for $u in $$.users[] let $c := $u.city group by $c return {"city": $c, "count": count($u)}' pgo-obj.json > /dev/null 2>&1 || true

          if [ -f default.iprof ]; then
            echo "PGO profile collected ($(wc -c < default.iprof) bytes)"
          else
            echo "Warning: PGO profile not found, building without PGO"
          fi

      - name: Build optimized binary with PGO
        shell: bash
        run: |
          # G1 GC only supported on Linux; macOS/Windows use serial GC
          if [[ "${{ matrix.os-name }}" != "linux" ]]; then
            echo "Non-Linux: patching pom.xml to use serial GC"
            sed -i.bak 's/--gc=G1/--gc=serial/g' pom.xml || \
            sed -i '' 's/--gc=G1/--gc=serial/g' pom.xml
          fi

          if [ -f default.iprof ]; then
            echo "Building with PGO + O3"
            mvn -Pnative-pgo package -DskipTests
          else
            echo "Building without PGO (fallback)"
            mvn -Pnative package -DskipTests
          fi

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/bjq target/${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/bjq.exe target/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} target/${{ matrix.artifact }}
