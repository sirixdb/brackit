name: Build native binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os-name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: linux
            arch: amd64
            artifact: bjq-linux-amd64
          - runner: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
            artifact: bjq-linux-arm64
          - runner: macos-13
            os-name: macos
            arch: amd64
            artifact: bjq-macos-amd64
          - runner: macos-latest
            os-name: macos
            arch: arm64
            artifact: bjq-macos-arm64
          - runner: windows-latest
            os-name: windows
            arch: amd64
            artifact: bjq-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'oracle'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test data for PGO
        shell: bash
        run: |
          python3 -c "
          import json, random
          random.seed(42)
          users = [{'name': f'user_{i}', 'age': random.randint(18,65), 'city': random.choice(['NYC','LA','Chicago','Houston','Phoenix'])} for i in range(50000)]
          orders = [{'id': i, 'user_id': random.randint(0,9999), 'amount': round(random.uniform(10,500),2)} for i in range(50000)]
          json.dump({'users': users, 'orders': orders}, open('pgo-data.json','w'))
          "

      - name: Build instrumented binary
        run: mvn -Pnative-pgo-instrument package -DskipTests

      - name: Collect PGO profiles
        shell: bash
        run: |
          INSTRUMENTED=target/bjq-instrument
          if [ -f "${INSTRUMENTED}.exe" ]; then INSTRUMENTED="${INSTRUMENTED}.exe"; fi

          # Run representative workloads
          $INSTRUMENTED 'count(for $u in $$.users[] where $u.age > 30 return $u.name)' pgo-data.json > /dev/null 2>&1 || true
          $INSTRUMENTED 'for $u in $$.users[] let $c := $u.city group by $c return {"city": $c, "count": count($u)}' pgo-data.json > /dev/null 2>&1 || true
          $INSTRUMENTED 'for $u in $$.users[], $o in $$.orders[] where $o.user_id eq $u.age return {"name": $u.name, "amount": $o.amount}' pgo-data.json > /dev/null 2>&1 || true

          # Move profile to expected location
          if [ -f default.iprof ]; then
            echo "PGO profile collected successfully"
          else
            echo "Warning: PGO profile not found, building without PGO"
          fi

      - name: Build optimized binary with PGO
        run: |
          if [ -f default.iprof ]; then
            mvn -Pnative-pgo package -DskipTests
          else
            mvn -Pnative package -DskipTests
          fi
        shell: bash

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/bjq target/${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/bjq.exe target/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} target/${{ matrix.artifact }}
