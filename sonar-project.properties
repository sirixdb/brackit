# CPD exclusions: Dur (xs:duration) and DTD (xs:dayTimeDuration) are sibling
# duration types whose constructors, fields, and parsers necessarily share
# structure dictated by the XML Schema spec. Deduping them would require
# breaking the public API (constructor signatures are part of it).
# This duplication predates the int-widening fix in PR #95 and is not
# introduced by it.
sonar.cpd.exclusions=src/main/java/io/brackit/query/atomic/Dur.java,src/main/java/io/brackit/query/atomic/DTD.java
